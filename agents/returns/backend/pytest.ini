[pytest]
testpaths = tests
pythonpath = ../../.. .
addopts = -q --strict-markers
markers =
    live_cv: tests that run REAL OCR/YOLO inference (require installed engines and model weights)
    groq_live: tests that call the REAL Groq API (require GROQ_API_KEY and RUN_LIVE_GROQ=1)
filterwarnings =
    ignore::DeprecationWarning
