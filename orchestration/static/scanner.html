<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medha // Handheld Edge Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-canvas: #F7F3ED;          /* Warm ivory main background */
      --color-surface: #FFFCF8;         /* Soft white surfaces */
      --color-surface-soft: #F1EBE3;    /* Warm grey secondary */
      --color-text-primary: #191714;    /* Near-black primary text */
      --color-text-secondary: #6F675F;  /* Supporting copy */
      --color-text-muted: #9A9187;      /* Metadata */
      --color-border: #E7DED3;          /* Hairline divider */
      --color-accent-gold: #B78A59;     /* Champagne gold highlight */
      --color-success: #68815D;         /* Olive sage green */
      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      padding: 18px 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 18px;
    }
    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .brand {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-primary);
      letter-spacing: 0.02em;
    }
    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-accent-gold);
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .station-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--color-success);
      background: rgba(104, 129, 93, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(104, 129, 93, 0.35);
    }
    .control-group {
      margin-bottom: 14px;
    }
    label {
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--color-accent-gold);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-primary);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-family: var(--font-mono);
      font-weight: 600;
      outline: none;
      transition: all 0.18s ease;
    }
    input:focus {
      border-color: var(--color-accent-gold);
      box-shadow: 0 0 0 3px rgba(183, 138, 89, 0.18);
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: var(--color-surface-soft);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
    }
    .seg-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--color-text-secondary);
      padding: 8px 2px;
      border-radius: 8px;
      font-size: 11px;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.16s ease;
    }
    .seg-btn.active {
      background: var(--color-surface);
      color: var(--color-text-primary);
      border-color: var(--color-border);
      box-shadow: 0 2px 6px rgba(25, 23, 20, 0.06);
    }
    .camera-frame {
      background: var(--color-surface);
      border: 1.5px dashed var(--color-border);
      border-radius: 16px;
      height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 0 16px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px -6px rgba(25, 23, 20, 0.05);
      transition: all 0.18s ease;
    }
    .camera-frame:hover {
      border-color: var(--color-accent-gold);
    }
    .camera-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .camera-hint {
      font-size: 12.5px;
      color: var(--color-text-secondary);
      font-weight: 500;
      text-align: center;
    }
    .btn-action {
      background: var(--color-text-primary);
      color: #ffffff;
      border: 1px solid var(--color-text-primary);
      padding: 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      font-family: var(--font-sans);
      margin-top: auto;
      box-shadow: 0 6px 18px rgba(25, 23, 20, 0.15);
      transition: all 0.18s ease;
    }
    .btn-action:hover:not(:disabled) {
      background: #2D2824;
      border-color: var(--color-accent-gold);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(25, 23, 20, 0.22);
    }
    .btn-action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .receipt-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: none;
      box-shadow: 0 4px 14px -6px rgba(25, 23, 20, 0.05);
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .receipt-row:last-child {
      margin-bottom: 0;
    }
    .receipt-val {
      color: var(--color-text-primary);
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <span class="brand">Medha</span>
      <span class="brand-sub">EDGE SCANNER</span>
    </div>
    <div class="station-badge">ONLINE · PWA</div>
  </header>

  <div class="control-group">
    <label>Active Subject / Unit ID</label>
    <input type="text" id="unitInput" value="UNIT-0014" placeholder="e.g. UNIT-0014">
  </div>

  <div class="control-group">
    <label>Inspection Station (Agent Target)</label>
    <div class="segmented">
      <div class="seg-btn active" data-stage="receiving">Receiving</div>
      <div class="seg-btn" data-stage="prep">Prep</div>
      <div class="seg-btn" data-stage="pack">Pack</div>
      <div class="seg-btn" data-stage="returns">Returns</div>
      <div class="seg-btn" data-stage="recovery">Recovery</div>
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

  <div class="camera-frame" id="cameraFrame">
    <img id="previewImg" alt="Preview">
    <div id="cameraIcon" style="width: 38px; height: 38px; color: var(--color-accent-gold); display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <div class="camera-hint" id="cameraHint">Tap to open Camera / Snap Photo</div>
  </div>

  <div class="receipt-card" id="receiptCard">
    <div class="receipt-row">
      <span style="color: var(--color-text-muted);">DELIVERY:</span>
      <span class="receipt-val" id="receiptDelivery" style="color: var(--color-success); font-weight: 700;">CONFIRMED BY ORCHESTRATOR</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--color-text-muted);">ROUTED TO:</span>
      <span class="receipt-val" id="receiptRoute" style="color: var(--color-accent-gold); font-weight: 700;">RECEIVING AGENT</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--color-text-muted);">STATUS:</span>
      <span class="receipt-val" id="receiptStatus" style="color: var(--color-accent-gold); font-weight: 600;">LIVE PROCESSING IN COCKPIT</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--color-text-muted);">SHA-256:</span>
      <span class="receipt-val" id="receiptHash">—</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--color-text-muted);">AGENT VERDICT:</span>
      <span class="receipt-val" id="receiptVerdict">—</span>
    </div>
  </div>

  <button class="btn-action" id="btnUpload" disabled>
    Capture & Transmit to Desktop
  </button>

  <script src="/static/scanner.js"></script>
</body>
</html>
