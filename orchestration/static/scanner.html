<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CUBE // Handheld Scanner</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131826;
      --border: #232b3e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #2563eb;
      --success: #22c55e;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .station-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--success);
      background: rgba(34, 197, 94, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .control-group {
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-family: var(--font-mono);
      outline: none;
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(62px, 1fr));
      gap: 6px;
    }
    .seg-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 4px;
      border-radius: 5px;
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      text-align: center;
    }
    .seg-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .camera-frame {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 8px;
      height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .camera-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .camera-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .btn-action {
      background: #ffffff;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      font-family: var(--font-sans);
      margin-top: auto;
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .receipt-card {
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 6px;
      padding: 12px;
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: none;
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .receipt-val {
      color: #93c5fd;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">CUBE // HANDHELD</div>
    <div class="station-badge">ONLINE</div>
  </header>

  <div class="control-group">
    <label>Active Subject / Unit ID</label>
    <input type="text" id="unitInput" value="UNIT-0014" placeholder="e.g. UNIT-0014">
  </div>

  <div class="control-group">
    <label>Inspection Station (Agent Target)</label>
    <div class="segmented">
      <div class="seg-btn active" data-stage="receiving">Receiving</div>
      <div class="seg-btn" data-stage="prep">Prep</div>
      <div class="seg-btn" data-stage="pack">Pack</div>
      <div class="seg-btn" data-stage="returns">Returns</div>
      <div class="seg-btn" data-stage="recovery">Recovery</div>
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

  <div class="camera-frame" id="cameraFrame">
    <img id="previewImg" alt="Preview">
    <div id="cameraIcon" style="font-size: 32px;">📷</div>
    <div class="camera-hint" id="cameraHint">Tap to open Camera / Snap Photo</div>
  </div>

  <div class="receipt-card" id="receiptCard">
    <div class="receipt-row">
      <span style="color: var(--muted);">DELIVERY:</span>
      <span class="receipt-val" id="receiptDelivery" style="color: #4ade80; font-weight: 700;">✓ CONFIRMED BY ORCHESTRATOR</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--muted);">ROUTED TO:</span>
      <span class="receipt-val" id="receiptRoute" style="color: #60a5fa; font-weight: 700;">RECEIVING AGENT</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--muted);">STATUS:</span>
      <span class="receipt-val" id="receiptStatus" style="color: #facc15;">LIVE PROCESSING IN COCKPIT</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--muted);">SHA-256:</span>
      <span class="receipt-val" id="receiptHash">—</span>
    </div>
    <div class="receipt-row">
      <span style="color: var(--muted);">AGENT VERDICT:</span>
      <span class="receipt-val" id="receiptVerdict">—</span>
    </div>
  </div>

  <button class="btn-action" id="btnUpload" disabled>
    Capture & Transmit to Desktop
  </button>

  <script src="/static/scanner.js"></script>
</body>
</html>
